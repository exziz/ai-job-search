.com</a> , TFS and Mr D. We like to promote from within: Here's your chance.</li>\n</ul>\n\n<h4>Duties & Responsibilities</h4>\n<p></p>\n\n<p><strong>Your mission, should you choose to accept it:</strong></p>\n\n<ul>\n\t<li>Gain a deep understanding of the Catalogue division in terms of its strategic objectives, business processes, available tools &amp; systems, and relevant external best practice benchmarks</li>\n\t<li>Work closely with the Product Lead for Catalogue to define and maintain a Product Roadmap that delivers on technical developments required to support the Catalogue Division in achieving its strategic objectives</li>\n\t<li>Measure the success of developments via the tracking of relevant metrics&nbsp;</li>\n\t<li>Take ownership of improving these metrics by identifying and prioritising appropriate roadmap projects</li>\n\t<li>Define the strategic business requirements for technical systems development related to specific projects prioritised on the Product Roadmap, using relevant data to support decision-making</li>\n\t<li>Translate business requirements into functional and technical IT user stories and project specifications, by ensuring that projects are broken down into phases to deliver immediate business benefit</li>\n\t<li>End-to-end project management of technical projects throughout the entire product development lifecycle – setting timelines, driving project schedules, leading cross-functional development teams from design through to release, and managing the production launch</li>\n\t<li>Manage all stakeholder communications - to ensure appropriate input on the Product Roadmap prioritisation and communication on its execution</li>\n\t<li>Manage the engineering backlog via appropriate sprint prioritisation and planning</li>\n</ul>\n\n<p><strong>Who’s who in the tech space</strong></p>\n\n<p>You will report directly to the Product Lead for Catalogue and collaborate with a team of software engineers, QA engineers, and UX designers.</p>\n\n<h4>Desired Experience & Qualification</h4>\n<p>&nbsp;</p>\n\n<p><strong>Qualifications and experience:</strong></p>\n\n<ul>\n\t<li>Relevant Bachelor's Degree or Advanced Diploma (Information Systems/Computer Science/Engineering/Commerce) with at least 3 years of experience in product management, business analysis, or a related role, preferably driving large, company-wide initiatives (through projects or responsibilities)</li>\n\t<li>In the absence of a Bachelor's Degree or Advanced Diploma in a related field, an equivalent experience requirement must be met which equates to at least 7 years of experience in product management, business analysis, or a related role, preferably driving large, company-wide initiatives (through projects or responsibilities)</li>\n\t<li>Experience in an agile/iterative project management and development environment is beneficial&nbsp;</li>\n\t<li>Experience in an e-commerce or compliance environment is beneficial</li>\n</ul>\n\n<p>&nbsp;</p>\n\n<p><strong>Attributes required:</strong></p>\n\n<ul>\n\t<li>A proven track record of delivering results, in a fast-paced environment</li>\n\t<li>Demonstrates strong commercial acumen with analytical capabilities, proficient in SQL for obtaining and analysing data, and effectively leverages insights to drive informed decision-making.</li>\n\t<li>Highly structured thinker with strong attention to detail</li>\n\t<li>Strong technical understanding &amp; experience with the development process</li>\n\t<li>Strong project management and communication skills – able to effectively manage cross-functional stakeholders (in particular the engineering team) to ensure projects are delivered according to specifications on time</li>\n\t<li>A flexible and adaptable mindset</li>\n\t<li>Proven experience with system scalability and automation projects</li>\n\t<li>Ability to balance rapid growth with robust compliance and quality control mechanisms</li>\n</ul>\n\n<h4>Interested?</h4>\n<p></p>\n\n<p><strong>Let’s talk about life @ Takealot Group</strong></p>\n\n<ul>\n\t<li><strong>No doors</strong>: We aren’t fans of stuffy offices or siloed work environments. See someone you like? High five, collab and make something great.</li>\n\t<li><strong>Remote working</strong>: Love water cooler chats and working from home? Takealot.com offers a hybrid working model for the best of both worlds.</li>\n\t<li><strong>Mentorship programme</strong>: We aren’t kidding when we say the people with the best people win. Now’s your chance to be one of the best, by learning from the best.</li>\n\t<li><strong>Naspers Tech Community</strong> <strong>&amp; Online Learning</strong>: Share ideas and grow with global industry leaders who are all just a Slack message away. Love to learn? Up-skill with free access to courses on MyAcademy, Udacity, Coursera and more.</li>\n\t<li><strong>Good times</strong>: Get to know the other extraordinary minds at takealot.com during regular social events and out-of-office activities (think hikes, think mini-golf, think good times).</li>\n\t<li><strong>Staff discount</strong>. Millions of products across 28 departments. What more could you ask for?</li>\n\t<li><strong>Birthday leave</strong>: Cake Day all the way. Enjoy your day off - you deserve it.&nbsp;</li>\n\t<li><strong>Help when you need it most</strong>: Confidential counselling, legal support and financial guidance, for free, anytime, anywhere.&nbsp;</li>\n\t<li><strong>Tech stack (for days): </strong>ReactJS, Python, Scala, Kotlin, Swift, Google Cloud, Kafka, Redis, Kubernetes and all things machine learning. If you build it, they will come.</li>\n\t<li><strong>Free parking: </strong>No more 5km fun runs to your desk (unless you want to).&nbsp;</li>\n</ul>\n\n<p>&nbsp;</p>\n\n<p><strong>Like what you see?&nbsp;</strong></p>\n\n<p>If you meet the above you are an <strong>Extraordinary Mind. </strong>Apply today!!</p>\n\n<p><em>Takealot is an Equal Opportunity Employer. Applicants from the previously disadvantaged groups and people with disabilities will be given preference.</em></p>\n"}
